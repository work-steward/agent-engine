name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository-hygiene:
    name: repository-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check repository policies and hygiene
        run: python3 scripts/check_repository.py
      - name: Check whitespace
        run: git diff-tree --check HEAD
  kernel-tests:
    name: kernel-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version-file: .python-version
      - name: Install pinned dependency tool
        run: python -m pip install uv==0.13.9
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Lint Python, Markdown, YAML, and repository files
        run: make lint
      - name: Test model and independent simulator
        run: make test
